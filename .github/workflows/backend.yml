name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: graphmind_test
          POSTGRES_USER: graphmind
          POSTGRES_PASSWORD: graphmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U graphmind -d graphmind_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run PostgreSQL migration tests
        working-directory: backend
        env:
          GRAPHMIND_TEST_POSTGRES_URL: postgresql+psycopg://graphmind:graphmind@localhost:5432/graphmind_test
        run: python -m pytest -q tests/test_database_migrations.py

      - name: Run backend test suite
        working-directory: backend
        env:
          GRAPHMIND_TEST_POSTGRES_URL: postgresql+psycopg://graphmind:graphmind@localhost:5432/graphmind_test
        run: python -m pytest -q
